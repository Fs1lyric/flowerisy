<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A pomodoro timer and to-do list for one quiet session at a time." />
    <meta name="theme-color" content="#F3E8D8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1612" media="(prefers-color-scheme: dark)" />
    <title>Flowerisy</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to timer</a>
    <header class="topbar">
      <p class="mark">Flowerisy</p>
      <div class="topbar-actions">
        <button type="button" class="ghost" id="notify-btn" aria-pressed="false">
          Alerts off
        </button>
        <button type="button" class="ghost" id="theme-btn" aria-label="Switch color theme">
          Theme
        </button>
      </div>
    </header>

    <main id="main" class="desk">
      <section class="clock-panel" aria-labelledby="mode-label">
        <p class="eyebrow" id="mode-label">Focus</p>
        <div class="dial" aria-hidden="true">
          <svg viewBox="0 0 220 220" class="ring">
            <circle class="ring-track" cx="110" cy="110" r="96" />
            <circle class="ring-progress" cx="110" cy="110" r="96" />
          </svg>
          <p class="time" id="time-display">25:00</p>
        </div>
        <p class="active-task" id="active-task">No task selected</p>
        <div class="modes" role="tablist" aria-label="Timer mode">
          <button type="button" class="mode is-active" data-mode="focus" role="tab" aria-selected="true">
            Focus 25
          </button>
          <button type="button" class="mode" data-mode="short" role="tab" aria-selected="false">
            Short 5
          </button>
          <button type="button" class="mode" data-mode="long" role="tab" aria-selected="false">
            Long 15
          </button>
        </div>
        <div class="controls">
          <button type="button" class="primary" id="toggle-btn">Start</button>
          <button type="button" class="ghost" id="reset-btn">Reset</button>
          <button type="button" class="ghost" id="skip-btn">Skip</button>
        </div>
        <p class="status" id="status" aria-live="polite">Ready. Space starts the timer.</p>
        <p class="tally">
          Blooms today
          <strong id="bloom-count">0</strong>
        </p>
      </section>

      <section class="list-panel" aria-labelledby="list-heading">
        <div class="list-head">
          <h1 id="list-heading">Work ahead</h1>
          <p id="list-meta">0 open</p>
        </div>
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="140"
            placeholder="Add a task and press Enter"
            autocomplete="off"
            required
          />
          <button type="submit" class="primary compact">Add</button>
        </form>
        <ul id="task-list" class="tasks"></ul>
        <p class="empty" id="empty-state">Nothing planted yet. Add the one thing you will finish this round.</p>
      </section>
    </main>

    <footer class="colophon">
      <p>Local only. Tasks and blooms stay in this browser.</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
